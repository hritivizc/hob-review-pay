<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3E2723" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Pay · High On Beans</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="brand" aria-label="High On Beans">
      <div class="logo" aria-hidden="true">☕</div>
      <h1 class="brand-name">High On Beans</h1>
      <p class="brand-tag">HOB</p>
    </header>
    <main class="card">
      <p class="lead">Pay with PhonePe or GPay</p>
      <p class="sub">Choose an app below. This will not open WhatsApp Pay.</p>

      <button type="button" id="payPhonePe" class="btn btn-primary">Pay with PhonePe</button>
      <button type="button" id="payGPay" class="btn btn-primary" style="margin-top:0.65rem">Pay with Google Pay</button>

      <a class="btn btn-ghost" href="index.html?v=3" style="margin-top:0.65rem">Back</a>
      <p class="pay-hint" style="margin-top:1.25rem">Hard-refresh if you still see an old page (pull down to reload).</p>
    </main>
  </div>
  <script>
    (function () {
      var q = "pa=7073123656-6@ibl&pn=Ritik%20Sharma&mc=0000&mode=02&purpose=00";
      /* Never use upi:// — WhatsApp registers for that scheme */
      var links = {
        phonepe: [
          "phonepe://pay?" + q,
          "ppe://upi/pay?" + q,
          "intent://pay?" + q + "#Intent;scheme=phonepe;package=com.phonepe.app;end"
        ],
        gpay: [
          "gpay://upi/pay?" + q,
          "tez://upi/pay?" + q,
          "intent://upi/pay?" + q + "#Intent;scheme=tez;package=com.google.android.apps.nbu.paisa.user;end",
          "intent://upi/pay?" + q + "#Intent;scheme=gpay;package=com.google.android.apps.nbu.paisa.user;end"
        ]
      };

      function openApp(list) {
        var i = 0;
        function tryNext() {
          if (i >= list.length) return;
          var url = list[i++];
          /* Prefer top navigation for custom schemes */
          window.location.href = url;
          /* If first scheme fails silently, try next after a short delay */
          if (i < list.length) {
            setTimeout(tryNext, 1200);
          }
        }
        tryNext();
      }

      var pe = document.getElementById("payPhonePe");
      var gp = document.getElementById("payGPay");
      if (pe) pe.addEventListener("click", function () { openApp(links.phonepe); });
      if (gp) gp.addEventListener("click", function () { openApp(links.gpay); });
    })();
  </script>
</body>
</html>
